version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-pgas_test}
      MYSQL_USER: ${DB_USER:-pgas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pgas_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/01-migrations.sql
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    ports:
      - "3306:3306"
    networks:
      - pgas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pgas_test}
      DB_USER: ${DB_USER:-pgas_user}
      DB_PASSWORD: ${DB_PASSWORD:-pgas_password}
      JWT_SECRET: ${JWT_SECRET:-pgas-test-jwt-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pgas-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "4080:80"
      - "4443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - pgas-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:

networks:
  pgas-network:
    driver: bridge
